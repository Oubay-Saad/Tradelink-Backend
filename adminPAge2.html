<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tradelink — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0f14;
  --surface: #141820;
  --surface2: #1c2230;
  --border: #252d3d;
  --accent: #3b82f6;
  --accent2: #06b6d4;
  --danger: #ef4444;
  --warn: #f59e0b;
  --success: #10b981;
  --text: #e2e8f0;
  --muted: #64748b;
  --font-display: 'Syne', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --font-mono: 'DM Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  height: 100vh;
  overflow: hidden;
}

/* ── LOGIN ── */
#login-view {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}
#login-view::before {
  content: '';
  position: absolute;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(59,130,246,.15) 0%, transparent 70%);
  top: -100px; left: -100px;
  pointer-events: none;
}
#login-view::after {
  content: '';
  position: absolute;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(6,182,212,.1) 0%, transparent 70%);
  bottom: -50px; right: -50px;
  pointer-events: none;
}

.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2.5rem;
  width: 380px;
  position: relative;
  z-index: 1;
  box-shadow: 0 25px 60px rgba(0,0,0,.5);
}
.login-logo {
  font-family: var(--font-display);
  font-size: 1.4rem;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin-bottom: 2rem;
  color: var(--accent);
}
.login-logo span { color: var(--text); }
.login-title { font-size: 1.5rem; font-weight: 700; margin-bottom: .3rem; }
.login-sub { color: var(--muted); font-size: .85rem; margin-bottom: 2rem; }

.field { margin-bottom: 1.1rem; }
.field label { display: block; font-size: .8rem; font-weight: 500; color: var(--muted); margin-bottom: .4rem; text-transform: uppercase; letter-spacing: .5px; }
.field input {
  width: 100%; padding: .7rem 1rem;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: .9rem;
  outline: none;
  transition: border-color .2s;
}
.field input:focus { border-color: var(--accent); }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: .6rem 1.2rem;
  border: none; border-radius: 7px;
  font-family: var(--font-body); font-size: .85rem; font-weight: 500;
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #2563eb; }
.btn-danger { background: rgba(239,68,68,.15); color: var(--danger); border: 1px solid rgba(239,68,68,.3); }
.btn-danger:hover { background: var(--danger); color: #fff; }
.btn-warn { background: rgba(245,158,11,.15); color: var(--warn); border: 1px solid rgba(245,158,11,.3); }
.btn-warn:hover { background: var(--warn); color: #fff; }
.btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--accent); }
.btn-full { width: 100%; justify-content: center; padding: .8rem; font-size: .95rem; }

#login-err { color: var(--danger); font-size: .82rem; margin-top: .8rem; display: none; }

/* ── DASHBOARD ── */
#app { display: none; height: 100vh; flex-direction: row; }

/* Sidebar */
.sidebar {
  width: 220px; flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.sidebar-logo {
  padding: 1.5rem;
  font-family: var(--font-display);
  font-size: 1.1rem; font-weight: 800;
  color: var(--accent);
  border-bottom: 1px solid var(--border);
  letter-spacing: -0.5px;
}
.sidebar-logo span { color: var(--muted); font-size: .75rem; font-family: var(--font-mono); font-weight: 400; display: block; margin-top: 2px; }

.nav-section { padding: 1rem 1rem .3rem; font-size: .7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: .6rem 1rem;
  margin: 1px .5rem;
  border-radius: 7px;
  cursor: pointer;
  color: var(--muted);
  font-size: .88rem;
  transition: all .15s;
  position: relative;
}
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: rgba(59,130,246,.1); color: var(--accent); }
.nav-item .icon { width: 18px; text-align: center; font-size: 1rem; }
.nav-badge {
  margin-left: auto;
  background: var(--accent);
  color: #fff;
  font-size: .65rem;
  font-family: var(--font-mono);
  padding: 1px 6px;
  border-radius: 99px;
  min-width: 18px; text-align: center;
}

.sidebar-bottom { margin-top: auto; padding: 1rem; border-top: 1px solid var(--border); }
.admin-pill {
  background: var(--surface2); border-radius: 8px; padding: .6rem .8rem;
  display: flex; align-items: center; gap: 8px; margin-bottom: .8rem;
}
.admin-avatar {
  width: 28px; height: 28px; border-radius: 7px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-size: .7rem; font-weight: 700; color: #fff;
}
.admin-name { font-size: .82rem; font-weight: 500; }
.admin-role { font-size: .7rem; color: var(--muted); }

/* Main */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: .9rem 1.5rem;
  display: flex; align-items: center; justify-content: space-between;
}
.topbar-title { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; }
.topbar-actions { display: flex; gap: .5rem; }

/* Content area */
.content { flex: 1; overflow-y: auto; padding: 1.5rem; }
.content::-webkit-scrollbar { width: 5px; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Stats row */
.stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: .75rem; margin-bottom: 1.5rem; }
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 1rem 1.2rem;
}
.stat-label { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: .4rem; }
.stat-value { font-family: var(--font-mono); font-size: 1.4rem; font-weight: 500; }
.stat-card.blue .stat-value { color: var(--accent); }
.stat-card.cyan .stat-value { color: var(--accent2); }
.stat-card.green .stat-value { color: var(--success); }
.stat-card.orange .stat-value { color: var(--warn); }
.stat-card.red .stat-value { color: var(--danger); }

/* Table */
.table-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden;
}
.table-header {
  padding: .9rem 1.2rem;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.table-title { font-size: .88rem; font-weight: 600; }
.search-box {
  display: flex; align-items: center; gap: .5rem;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 7px; padding: .35rem .8rem;
}
.search-box input {
  background: none; border: none; outline: none;
  color: var(--text); font-family: var(--font-body); font-size: .82rem;
  width: 160px;
}
.search-box input::placeholder { color: var(--muted); }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th {
  background: var(--surface2); padding: .6rem 1rem;
  text-align: left; font-size: .72rem; text-transform: uppercase;
  letter-spacing: .5px; color: var(--muted); font-weight: 500;
  white-space: nowrap;
}
td {
  padding: .65rem 1rem; border-top: 1px solid var(--border);
  font-size: .83rem; max-width: 220px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
tr:hover td { background: rgba(255,255,255,.02); }

.tag {
  display: inline-block; padding: 2px 8px; border-radius: 99px;
  font-size: .7rem; font-weight: 500; font-family: var(--font-mono);
}
.tag-blue { background: rgba(59,130,246,.15); color: var(--accent); }
.tag-green { background: rgba(16,185,129,.15); color: var(--success); }
.tag-warn { background: rgba(245,158,11,.15); color: var(--warn); }
.tag-red { background: rgba(239,68,68,.15); color: var(--danger); }
.tag-cyan { background: rgba(6,182,212,.15); color: var(--accent2); }
.tag-gray { background: var(--surface2); color: var(--muted); }

.actions-cell { display: flex; gap: 5px; }
.action-btn {
  padding: 3px 9px; border-radius: 5px; font-size: .75rem;
  border: none; cursor: pointer; font-family: var(--font-body); font-weight: 500;
  transition: all .15s;
}
.action-edit { background: rgba(59,130,246,.15); color: var(--accent); }
.action-edit:hover { background: var(--accent); color: #fff; }
.action-delete { background: rgba(239,68,68,.12); color: var(--danger); }
.action-delete:hover { background: var(--danger); color: #fff; }

/* Pagination */
.pagination {
  display: flex; align-items: center; justify-content: space-between;
  padding: .75rem 1.2rem; border-top: 1px solid var(--border);
  font-size: .8rem; color: var(--muted);
}
.page-btns { display: flex; gap: 4px; }
.page-btn {
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
  border-radius: 5px; border: 1px solid var(--border); background: none; color: var(--text);
  cursor: pointer; font-size: .8rem; transition: all .15s;
}
.page-btn:hover, .page-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Loading / Empty */
.state-box {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 3rem; gap: .7rem; color: var(--muted);
}
.state-icon { font-size: 2.5rem; opacity: .4; }
.state-msg { font-size: .9rem; }

/* MODAL */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.7); z-index: 999;
  align-items: center; justify-content: center;
}
.overlay.open { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 2rem;
  width: 90%; max-width: 520px;
  max-height: 85vh; overflow-y: auto;
  box-shadow: 0 30px 60px rgba(0,0,0,.5);
}
.modal::-webkit-scrollbar { width: 4px; }
.modal::-webkit-scrollbar-thumb { background: var(--border); }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
.modal-title { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; }
.close-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.3rem; line-height: 1; transition: color .15s; }
.close-btn:hover { color: var(--text); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
.form-group { margin-bottom: .9rem; }
.form-group.full { grid-column: 1 / -1; }
.form-group label { display: block; font-size: .75rem; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: .35rem; font-weight: 500; }
.form-group input,
.form-group select,
.form-group textarea {
  width: 100%; padding: .6rem .85rem;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 7px; color: var(--text);
  font-family: var(--font-body); font-size: .88rem; outline: none;
  transition: border-color .2s;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus { border-color: var(--accent); }
.form-group textarea { resize: vertical; min-height: 80px; }
.form-group select option { background: var(--surface2); }
.modal-foot { display: flex; justify-content: flex-end; gap: .6rem; margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1.2rem; }

/* Toast */
.toast-container { position: fixed; top: 1.5rem; right: 1.5rem; z-index: 9999; display: flex; flex-direction: column; gap: .5rem; }
.toast {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 9px; padding: .75rem 1.2rem;
  font-size: .85rem; box-shadow: 0 8px 20px rgba(0,0,0,.3);
  display: flex; align-items: center; gap: .6rem;
  animation: slideIn .25s ease;
  min-width: 250px;
}
.toast.success { border-color: var(--success); }
.toast.error { border-color: var(--danger); }
@keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

/* Spinner */
.spinner {
  width: 20px; height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .6s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Profile pic thumbnail */
.avatar-thumb {
  width: 28px; height: 28px; border-radius: 6px;
  object-fit: cover; vertical-align: middle;
}
.avatar-placeholder {
  width: 28px; height: 28px; border-radius: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: .6rem; color: var(--muted); vertical-align: middle;
}

/* Status select in table */
.inline-status {
  background: none; border: none; color: inherit; cursor: pointer;
  font-family: var(--font-mono); font-size: .7rem; padding: 0;
}
</style>
</head>
<body>

<!-- ── LOGIN ── -->
<section id="login-view">
  <div class="login-card">
    <div class="login-logo">TRADE<span>LINK</span></div>
    <div class="login-title">Admin Access</div>
    <div class="login-sub">Restricted — authorized personnel only</div>
    <div class="field">
      <label>Phone Number</label>
      <input type="text" id="log-phone" placeholder="0XXXXXXXXX" autocomplete="off">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="log-pass" placeholder="••••••••">
    </div>
    <button class="btn btn-primary btn-full" id="login-btn" onclick="doLogin()">Sign In</button>
    <div id="login-err"></div>
  </div>
</section>

<!-- ── DASHBOARD ── -->
<section id="app">
  <aside class="sidebar">
    <div class="sidebar-logo">TRADELINK<span>admin console</span></div>

    <div class="nav-section">Data</div>
    <div class="nav-item active" data-tab="users" onclick="switchTab(this)">
      <span class="icon">👤</span> Users <span class="nav-badge" id="badge-users">—</span>
    </div>
    <div class="nav-item" data-tab="posts" onclick="switchTab(this)">
      <span class="icon">📸</span> Posts <span class="nav-badge" id="badge-posts">—</span>
    </div>
    <div class="nav-item" data-tab="services" onclick="switchTab(this)">
      <span class="icon">🔧</span> Services <span class="nav-badge" id="badge-services">—</span>
    </div>
    <div class="nav-item" data-tab="requests" onclick="switchTab(this)">
      <span class="icon">📋</span> Requests <span class="nav-badge" id="badge-requests">—</span>
    </div>
    <div class="nav-item" data-tab="reviews" onclick="switchTab(this)">
      <span class="icon">⭐</span> Reviews <span class="nav-badge" id="badge-reviews">—</span>
    </div>

    <div class="sidebar-bottom">
      <div class="admin-pill">
        <div class="admin-avatar" id="admin-initials">A</div>
        <div>
          <div class="admin-name" id="admin-name">Admin</div>
          <div class="admin-role">Super Admin</div>
        </div>
      </div>
      <button class="btn btn-ghost" style="width:100%; justify-content:center;" onclick="logout()">Logout</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-title" id="tab-title">Users</div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" onclick="loadData()" title="Refresh">⟳ Refresh</button>
        <button class="btn btn-primary" id="create-btn" onclick="openCreate()">+ New User</button>
      </div>
    </div>

    <div class="content" id="content">
      <div class="state-box"><div class="spinner"></div></div>
    </div>
  </main>
</section>

<!-- ── MODAL ── -->
<div class="overlay" id="modal-overlay" onclick="overlayClick(event)">
  <div class="modal" id="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="modal-title">Create</div>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="modal-save" onclick="saveModal()">Save</button>
    </div>
  </div>
</div>

<!-- ── TOAST ── -->
<div class="toast-container" id="toast-container"></div>

<script>
const API = 'http://localhost:3000';
let token = localStorage.getItem('tl_token');
let currentTab = 'users';
let allData = [];
let filteredData = [];
let page = 1;
const PAGE_SIZE = 15;
let editId = null;

// ── BOOT ──
if (token) showApp();

// ── AUTH ──
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('login-view').style.display !== 'none') doLogin();
});

async function doLogin() {
  const phone = document.getElementById('log-phone').value.trim();
  const pass  = document.getElementById('log-pass').value;
  const btn   = document.getElementById('login-btn');
  const err   = document.getElementById('login-err');

  if (!phone || !pass) { showLoginErr('Fill in all fields.'); return; }
  btn.textContent = 'Signing in…'; btn.disabled = true;

  try {
    const res  = await api('/auth/login', 'POST', { phone, password: pass }, false);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    if (data.user.role !== 'admin') throw new Error('Not an admin account');
    token = data.token;
    localStorage.setItem('tl_token', token);
    localStorage.setItem('tl_name', data.user.name || 'Admin');
    showApp();
  } catch (e) {
    showLoginErr(e.message);
  } finally {
    btn.textContent = 'Sign In'; btn.disabled = false;
  }
}

function showLoginErr(msg) {
  const el = document.getElementById('login-err');
  el.textContent = msg; el.style.display = 'block';
}

function logout() {
  localStorage.clear(); location.reload();
}

function showApp() {
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  const name = localStorage.getItem('tl_name') || 'Admin';
  document.getElementById('admin-name').textContent = name;
  document.getElementById('admin-initials').textContent = name.charAt(0).toUpperCase();
  loadAll();
}

// ── API ──
async function api(path, method='GET', body=null, auth=true) {
  const headers = { 'Content-Type': 'application/json' };
  if (auth) headers['Authorization'] = `Bearer ${token}`;
  const opts = { method, headers };
  if (body) opts.body = JSON.stringify(body);
  return fetch(API + path, opts);
}

// ── NAV ──
function switchTab(el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  currentTab = el.dataset.tab;
  page = 1;
  document.getElementById('tab-title').textContent = capitalize(currentTab);

  const labels = { users:'New User', posts:'New Post', services:'New Service', requests:'New Request', reviews:'New Review' };
  document.getElementById('create-btn').textContent = '+ ' + (labels[currentTab] || 'New');

  loadData();
}

// ── LOAD ALL (for badges) ──
async function loadAll() {
  const tabs = ['users','posts','services','requests','reviews'];
  for (const t of tabs) {
    try {
      const res = await api(`/admin/${t}`);
      if (res.ok) {
        const d = await res.json();
        const arr = Array.isArray(d) ? d : d[t] || d.results || Object.values(d).find(Array.isArray) || [];
        document.getElementById(`badge-${t}`).textContent = arr.length;
        if (t === 'users') { allData = arr; renderContent(); }
      }
    } catch {}
  }
}

async function loadData() {
  setContent('<div class="state-box"><div class="spinner"></div><span class="state-msg">Loading…</span></div>');
  try {
    const res = await api(`/admin/${currentTab}`);
    if (!res.ok) {
      if (res.status === 401) { logout(); return; }
      throw new Error(`HTTP ${res.status}`);
    }
    const raw = await res.json();
    allData = Array.isArray(raw) ? raw : raw[currentTab] || raw.results || Object.values(raw).find(Array.isArray) || [];
    filteredData = [...allData];
    page = 1;
    document.getElementById(`badge-${currentTab}`).textContent = allData.length;
    renderContent();
  } catch (e) {
    setContent(`<div class="state-box"><div class="state-icon">⚠️</div><div class="state-msg">Failed to load: ${e.message}</div></div>`);
  }
}

// ── RENDER ──
function renderContent() {
  if (!filteredData.length) {
    setContent('<div class="state-box"><div class="state-icon">📭</div><div class="state-msg">No records found.</div></div>');
    return;
  }

  const start = (page - 1) * PAGE_SIZE;
  const slice = filteredData.slice(start, start + PAGE_SIZE);
  const totalPages = Math.ceil(filteredData.length / PAGE_SIZE);

  let html = `
    <div class="table-card">
      <div class="table-header">
        <div class="table-title">${filteredData.length} record${filteredData.length !== 1 ? 's' : ''}</div>
        <div class="search-box">
          <span style="color:var(--muted)">🔍</span>
          <input type="text" placeholder="Search…" oninput="doSearch(this.value)" id="search-input">
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>${getHeaders(slice[0])}</tr></thead>
          <tbody>${slice.map(r => getRow(r)).join('')}</tbody>
        </table>
      </div>
      <div class="pagination">
        <span>Showing ${start+1}–${Math.min(start+PAGE_SIZE, filteredData.length)} of ${filteredData.length}</span>
        <div class="page-btns">${getPaginationHTML(totalPages)}</div>
      </div>
    </div>`;
  setContent(html);
}

function getHeaders(row) {
  return getCols(row).map(k => `<th>${k}</th>`).concat('<th>Actions</th>').join('');
}

function getCols(row) {
  const hide = new Set(['__v','password','images','tradesmanInfo','profilePic','updatedAt']);
  return Object.keys(row).filter(k => !hide.has(k));
}

function getRow(item) {
  const cols = getCols(item);
  const cells = cols.map(k => {
    let v = item[k];
    if (v === null || v === undefined || v === '') return `<td><span style="color:var(--muted)">—</span></td>`;
    if (k === '_id') return `<td><code style="font-family:var(--font-mono);font-size:.72rem;color:var(--muted)">${String(v).slice(-8)}</code></td>`;
    if (k === 'role') return `<td><span class="tag ${roleTag(v)}">${v}</span></td>`;
    if (k === 'status') return `<td><span class="tag ${statusTag(v)}">${v}</span></td>`;
    if (k === 'rating') return `<td><span style="color:var(--warn)">★</span> ${v}</td>`;
    if (k === 'budget' || k === 'estimatedPrice') return `<td><span style="color:var(--success)">DZD</span> ${v}</td>`;
    if (k === 'createdAt') return `<td style="color:var(--muted)">${formatDate(v)}</td>`;
    if (typeof v === 'object') {
      if (Array.isArray(v)) return `<td><span class="tag tag-gray">${v.length} item${v.length!==1?'s':''}</span></td>`;
      if (v && v._id) return `<td style="color:var(--accent)">${v.name || v._id}</td>`;
      return `<td><span class="tag tag-gray">object</span></td>`;
    }
    const s = String(v);
    return `<td title="${escHtml(s)}">${escHtml(s.length > 35 ? s.slice(0,35)+'…' : s)}</td>`;
  });

  return `<tr>
    ${cells.join('')}
    <td>
      <div class="actions-cell">
        <button class="action-btn action-edit" onclick='openEdit(${JSON.stringify(item)})'>Edit</button>
        <button class="action-btn action-delete" onclick="doDelete('${item._id}')">Delete</button>
      </div>
    </td>
  </tr>`;
}

function getPaginationHTML(total) {
  if (total <= 1) return '';
  let html = '';
  const window = 3;
  const start = Math.max(1, page - 1);
  const end   = Math.min(total, page + 1);
  if (start > 1) html += `<button class="page-btn" onclick="goPage(1)">1</button>`;
  if (start > 2) html += `<button class="page-btn" style="cursor:default">…</button>`;
  for (let i = start; i <= end; i++) {
    html += `<button class="page-btn${i===page?' active':''}" onclick="goPage(${i})">${i}</button>`;
  }
  if (end < total - 1) html += `<button class="page-btn" style="cursor:default">…</button>`;
  if (end < total) html += `<button class="page-btn" onclick="goPage(${total})">${total}</button>`;
  return `<button class="page-btn" onclick="goPage(${page-1})" ${page===1?'disabled':''}>‹</button>${html}<button class="page-btn" onclick="goPage(${page+1})" ${page===total?'disabled':''}>›</button>`;
}

function goPage(p) {
  if (p < 1 || p > Math.ceil(filteredData.length / PAGE_SIZE)) return;
  page = p; renderContent();
  setTimeout(() => { const si = document.getElementById('search-input'); if(si) si.value = currentSearch; }, 0);
}

let currentSearch = '';
function doSearch(q) {
  currentSearch = q;
  const lq = q.toLowerCase();
  filteredData = lq ? allData.filter(r => JSON.stringify(r).toLowerCase().includes(lq)) : [...allData];
  page = 1; renderContent();
  setTimeout(() => { const si = document.getElementById('search-input'); if(si) { si.value = q; si.focus(); } }, 0);
}

function openCreate() {
  editId = null;
  document.getElementById('modal-title').textContent = 'Create ' + capitalize(currentTab).replace(/s$/, '');
  document.getElementById('modal-save').textContent = 'Create';
  buildForm(SCHEMAS[currentTab]?.create || []);
  document.getElementById('modal-overlay').classList.add('open');
}

function openEdit(item) {
  editId = item._id;
  document.getElementById('modal-title').textContent = 'Edit ' + capitalize(currentTab).replace(/s$/, '');
  document.getElementById('modal-save').textContent = 'Save Changes';
  buildForm(SCHEMAS[currentTab]?.edit || [], item);
  document.getElementById('modal-overlay').classList.add('open');
}

function buildForm(fields, data={}) {
  const body = document.getElementById('modal-body');
  let html = '<div class="form-row">';
  fields.forEach((f, i) => {
    const val = data[f.key] !== undefined ? escHtml(String(data[f.key])) : '';
    const cls = (f.type === 'textarea' || i % 2 === 0 && !fields[i+1]) ? 'form-group full' : 'form-group';
    html += `<div class="${cls}"><label>${f.label}${f.required?' <span style="color:var(--danger)">*</span>':''}</label>`;
    if (f.type === 'select') {
      html += `<select name="${f.key}">`;
      if (!f.required) html += `<option value="">— none —</option>`;
      f.opts.forEach(o => html += `<option value="${o}" ${val===o?'selected':''}>${o}</option>`);
      html += `</select>`;
    } else if (f.type === 'textarea') {
      html += `<textarea name="${f.key}" rows="3">${val}</textarea>`;
    } else {
      html += `<input type="${f.type||'text'}" name="${f.key}" value="${val}" ${f.required?'required':''}>`;
    }
    html += `</div>`;
  });
  html += '</div>';
  body.innerHTML = html;
}

async function saveModal() {
  const form = document.getElementById('modal-body');
  const inputs = form.querySelectorAll('input,select,textarea');
  const body = {};
  let valid = true;
  inputs.forEach(el => {
    if (el.value.trim()) body[el.name] = el.value.trim();
    if (el.required && !el.value.trim()) { el.style.borderColor='var(--danger)'; valid = false; }
    else el.style.borderColor = '';
  });
  if (!valid) { toast('Fill in required fields', 'error'); return; }

  const btn = document.getElementById('modal-save');
  btn.textContent = 'Saving…'; btn.disabled = true;

  try {
    let res;
    if (editId) {
      // Route logic per tab
      let path = `/admin/${currentTab}/${editId}`;
      // requests status update uses different endpoint
      if (currentTab === 'requests') {
        // patch directly, admin route
        res = await api(path, 'PATCH', body);
      } else {
        res = await api(path, 'PATCH', body);
      }
    } else {
      // Create: use regular endpoints
      const createPaths = {
        users: '/auth/register',
        posts: null, // needs images, skip
        services: null,
        requests: null,
        reviews: null,
      };
      if (currentTab === 'users') {
        res = await api('/auth/register', 'POST', body, false);
      } else {
        throw new Error('Create via admin not supported for ' + currentTab + '. Use the app to create this resource.');
      }
    }

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error || err.message || `HTTP ${res.status}`);
    }

    toast(editId ? 'Updated successfully' : 'Created successfully', 'success');
    closeModal();
    loadData();
  } catch (e) {
    toast(e.message, 'error');
  } finally {
    btn.textContent = editId ? 'Save Changes' : 'Create'; btn.disabled = false;
  }
}

async function doDelete(id) {
  if (!confirm(`Permanently delete this ${currentTab.replace(/s$/, '')}?`)) return;
  try {
    const singular = { users:'users', posts:'posts', services:'services', requests:'requests', reviews:'reviews' };
    const res = await api(`/admin/${singular[currentTab]}/${id}`, 'DELETE');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    toast('Deleted', 'success');
    loadData();
  } catch (e) {
    toast('Delete failed: ' + e.message, 'error');
  }
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editId = null;
}

function overlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

// ── TOAST ──
function toast(msg, type='success') {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${type==='success'?'✓':'✕'}</span> ${escHtml(msg)}`;
  c.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ── UTILS ──
function setContent(html) { document.getElementById('content').innerHTML = html; }
function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatDate(d) {
  if (!d) return '—';
  const dt = new Date(d);
  return dt.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}
function roleTag(r) {
  return { customer:'tag-blue', tradesman:'tag-cyan', admin:'tag-red' }[r] || 'tag-gray';
}
function statusTag(s) {
  const sl = (s||'').toLowerCase();
  return { pending:'tag-warn', accepted:'tag-green', rejected:'tag-red' }[sl] || 'tag-gray';
}
